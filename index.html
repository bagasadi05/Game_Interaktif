<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Matematika</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <h1>Selamat Datang di Petualangan Matematika!</h1>
        <p>Pilih tingkat kesulitan dan jenis soal untuk memulai.</p>
        <div class="options-container">
            <div class="option-group">
                <h2>Mode Game:</h2>
                <button class="option-btn gameMode selected" data-game-mode="classic">Klasik</button>
                <button class="option-btn gameMode" data-game-mode="timeAttack">Time Attack</button>
            </div>
            <div class="option-group">
                <h2>Tingkat Kesulitan:</h2>
                <button class="option-btn difficulty" data-difficulty="easy">Mudah</button>
                <button class="option-btn difficulty" data-difficulty="medium">Sedang</button>
                <button class="option-btn difficulty" data-difficulty="hard">Sulit</button>
            </div>
            <div class="option-group">
                <h2>Jenis Operasi:</h2>
                <button class="option-btn operation" data-operation="addition">+</button>
                <button class="option-btn operation" data-operation="subtraction">-</button>
                <button class="option-btn operation" data-operation="multiplication">x</button>
                <button class="option-btn operation" data-operation="division">÷</button>
                <button class="option-btn operation" data-operation="mixed">?</button>
            </div>
        </div>
        <div id="high-score-container">
            Skor Tertinggi: <span id="high-score">...</span>
        </div>
        <button id="start-game-btn">Mulai Game</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div id="game-container">
            <div id="stats-container">
                <p>Skor: <span id="score">0</span></p>
                <div id="classic-stats">
                    <p>Soal: <span id="question-counter">1/5</span></p>
                </div>
                <div id="time-attack-stats">
                    <p>Waktu: <span id="timer">60</span></p>
                </div>
            </div>
            <button id="mute-btn">🔊</button>
            <div id="adventure-area">
                <div id="adventure-path">
                    <img id="player-icon" src="https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f6b6.svg" alt="Pemain">
                </div>
            </div>
            <div id="quiz-area">
                <p id="question">Pertanyaan akan muncul di sini</p>
                <input type="number" id="answer-input" placeholder="Masukkan jawabanmu">
                <button id="submit-btn">Jawab</button>
            </div>
            <p id="feedback"></p>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen">
        <h1>Permainan Selesai!</h1>
        <p>Skor Akhir Kamu:</p>
        <h2 id="final-score">0</h2>
        <button id="play-again-btn">Main Lagi</button>
    </div>

    <script src="script.js"></script>

    <!--
      TODO: Tambahkan URL file suara Anda di sini.
      Contoh: src="https://example.com/sounds/correct.mp3"
    -->
    <audio id="sound-correct" src="" preload="auto"></audio>
    <audio id="sound-wrong" src="" preload="auto"></audio>
    <audio id="sound-click" src="" preload="auto"></audio>
</body>
</html>
