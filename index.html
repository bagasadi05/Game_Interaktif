<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Matematika</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Petualangan Matematika</h1>
        <div id="adventure-area">
            <p id="story">Bantu pahlawan kita menyelesaikan misi dengan menjawab soal matematika!</p>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>
        <div id="quiz-area">
            <p id="question">Pertanyaan akan muncul di sini</p>
            <input type="number" id="answer-input" placeholder="Masukkan jawabanmu">
            <button id="submit-btn">Jawab</button>
        </div>
        <p id="feedback"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
